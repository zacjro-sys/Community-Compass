{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-1">Suggest a resource</h2>
                <p class="text-muted mb-4">Know a food bank, clinic, or program that isn't listed? Add it here — it goes straight into the directory.</p>

                <form method="post" action="{{ url_for('suggest_resource') }}" novalidate>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label" for="name">Name *</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ form.get('name', '') }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="category">Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="" disabled {% if not form.get('category') %}selected{% endif %}>Choose one</option>
                                {% for cat_name in categories %}
                                    <option value="{{ cat_name }}" {% if form.get('category') == cat_name %}selected{% endif %}>{{ cat_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label" for="description">Description *</label>
                            <textarea class="form-control" id="description" name="description" rows="3" required>{{ form.get('description', '') }}</textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="address">Address</label>
                            <input type="text" class="form-control" id="address" name="address" value="{{ form.get('address', '') }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="city">City *</label>
                            <input type="text" class="form-control" id="city" name="city" value="{{ form.get('city', '') }}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="state">State *</label>
                            <select class="form-select" id="state" name="state" required>
                                <option value="" disabled {% if not form.get('state') %}selected{% endif %}>Choose one</option>
                                {% for abbr, full_name in us_states.items() %}
                                    <option value="{{ abbr }}" {% if form.get('state') == abbr %}selected{% endif %}>{{ full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="phone">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ form.get('phone', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="website">Website</label>
                            <input type="url" class="form-control" id="website" name="website" value="{{ form.get('website', '') }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="hours">Hours</label>
                            <input type="text" class="form-control" id="hours" name="hours" placeholder="e.g. Mon-Fri 9am-5pm" value="{{ form.get('hours', '') }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="latitude">Latitude</label>
                            <input type="number" step="any" class="form-control" id="latitude" name="latitude" value="{{ form.get('latitude', '') }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="longitude">Longitude</label>
                            <input type="number" step="any" class="form-control" id="longitude" name="longitude" value="{{ form.get('longitude', '') }}">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-4">Submit resource</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
